name: 'Deploy to EKS'

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        working-directory: ./Application-Code
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netflix-clone:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/netflix-clone:latest

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::763103708432:role/github-oidc-role
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name netflix-cluster --region ${{ secrets.AWS_REGION }}

      - name: Deploy to EKS
        run: |
          kubectl apply -f Kubernetes/deployment.yaml
          kubectl apply -f Kubernetes/service.yaml
